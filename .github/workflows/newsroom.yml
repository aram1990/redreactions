name: Red Reactions newsroom

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-reactions-newsroom
  cancel-in-progress: false

jobs:
  publish:
    # For the one-day production test, schedules are enabled by default. Set the
    # RED_REACTIONS_NEWSROOM_SCHEDULE_ENABLED repository variable to false to pause.
    if: github.event_name != 'schedule' || vars.RED_REACTIONS_NEWSROOM_SCHEDULE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Discover, verify and validate newsroom candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSROOM_MODEL: ${{ vars.RED_REACTIONS_NEWSROOM_MODEL || 'gpt-5-mini' }}
          NEWSROOM_APPROVED_IMAGE_HOSTS: ${{ vars.RED_REACTIONS_NEWSROOM_APPROVED_IMAGE_HOSTS }}
        run: node scripts/newsroom/run.mjs

      - name: Commit approved newsroom output
        id: publish
        run: |
          if [ ! -f newsroom/.run-output.json ]; then
            echo "No newsroom output manifest was created."
            exit 1
          fi
          node -e "const fs=require('fs'); const run=JSON.parse(fs.readFileSync('newsroom/.run-output.json','utf8')); const {execFileSync}=require('child_process'); const files=[...run.files,run.stateFile]; if (files.length) execFileSync('git',['add','--',...files],{stdio:'inherit'});"
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git diff --cached --name-only
          git config user.name "redreactions-newsroom[bot]"
          git config user.email "redreactions-newsroom[bot]@users.noreply.github.com"
          git commit -m "Publish Red Reactions newsroom run"
          git push origin main
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        run: |
          if [ -f newsroom/.run-output.json ]; then cat newsroom/.run-output.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "${{ steps.publish.outputs.published }}" = "true" ]; then echo "Committed: ${{ steps.publish.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"; fi
